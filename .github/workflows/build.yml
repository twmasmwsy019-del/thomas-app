name: Build APK with p4a

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libssl-dev git unzip lld
        pip install --upgrade pip
        pip install --upgrade setuptools wheel cython==0.29.36 kivy pillow qrcode

    - name: Install python-for-android
      run: |
        pip install python-for-android

    - name: Build APK Directly
      run: |
        p4a apk --private . \
          --package=org.thomas \
          --name="Thomas Supermarket" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --requirements=python3,kivy,pillow,qrcode \
          --android-api 34 \
          --min-sdk 21 \
          --arch arm64-v8a

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: thomas-supermarket-apk
        path: "*.apk"
